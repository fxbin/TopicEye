# =============================================================================
# TopicEye CI — PR 轻量门禁（GitHub）+ 全量测试本地执行
# =============================================================================
# pull_request 触发轻量作业（类型检查 / 前端单测 / lint / 分层 / 安全扫描），
# 保证 PR 阶段有真实门禁。高成本的 PostgreSQL 全量测试不在 GitHub 跑：
# 本地执行 `make test-backend`（backend/scripts/test_full_local.sh，
# 一次性 PG 容器跑在 127.0.0.1:5433，不占用开发栈）。
# workflow_dispatch 保留用于合并后在 main 上手动复验轻量作业。
# =============================================================================

name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:

  # ── Frontend type check ──
  frontend-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit

  # ── Frontend unit tests + coverage gate ──
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Test with coverage
        run: npm run test:coverage

  # ── Lint: ruff（针对本次改动的 Python 文件做阻断式检查）──
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Compute changed Python files
        id: diff
        working-directory: .
        run: |
          BASE=$(git rev-parse HEAD^)
          FILES=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'backend/*.py' \
                  | sed 's|^backend/||' | grep '\.py$' || true)
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changed Python files:"
          echo "$FILES"
      - name: Ruff check (changed files)
        if: steps.diff.outputs.files != ''
        run: echo "${{ steps.diff.outputs.files }}" | xargs ruff check
      - name: Ruff format check (changed files)
        if: steps.diff.outputs.files != ''
        run: echo "${{ steps.diff.outputs.files }}" | xargs ruff format --check

  # ── 分层纪律 ──
  backend-layering:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check API layering
        run: python scripts/check_layering.py

  # ── 依赖安全扫描 ──
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Backend pip-audit
        id: backend_audit
        continue-on-error: true
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pip-audit
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend npm audit
        id: frontend_audit
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Enforce security audit results
        if: always()
        env:
          BACKEND_AUDIT_OUTCOME: ${{ steps.backend_audit.outcome }}
          FRONTEND_AUDIT_OUTCOME: ${{ steps.frontend_audit.outcome }}
        run: |
          echo "Backend audit: $BACKEND_AUDIT_OUTCOME"
          echo "Frontend audit: $FRONTEND_AUDIT_OUTCOME"
          if [ "$BACKEND_AUDIT_OUTCOME" != "success" ] || [ "$FRONTEND_AUDIT_OUTCOME" != "success" ]; then
            exit 1
          fi
