# =============================================================================
# TopicEye CI — PR 轻量门禁 + 全量测试手动/定时触发
# =============================================================================
# pull_request 触发轻量作业（类型检查 / 单测 / lint / 分层 / 安全扫描），
# 保证 PR 阶段有真实门禁；高成本的 PostgreSQL 全量测试仅在手动
# (workflow_dispatch) 与每日定时 (schedule, 04:00 CST) 运行。
# =============================================================================

name: CI

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"  # 20:00 UTC = 04:00 CST

jobs:
  # ── Backend tests on PostgreSQL（仅手动/定时触发，PR 阶段跳过）──
  backend-tests:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: topiceye_test
          POSTGRES_USER: topiceye
          POSTGRES_PASSWORD: topiceye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topiceye"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Run tests (PostgreSQL)
        env:
          DATABASE_URL: "postgresql+asyncpg://topiceye:topiceye@localhost:5432/topiceye_test"
          DUCKDB_THREADS: "1"
          DUCKDB_MEMORY_LIMIT: "128MB"
        run: python -m pytest tests/ -q --tb=short

  # ── Frontend type check ──
  frontend-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit

  # ── Frontend unit tests + coverage gate ──
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Test with coverage
        run: npm run test:coverage

  # ── Lint: ruff（针对本次改动的 Python 文件做阻断式检查）──
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Compute changed Python files
        id: diff
        working-directory: .
        run: |
          BASE=$(git rev-parse HEAD^)
          FILES=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'backend/*.py' \
                  | sed 's|^backend/||' | grep '\.py$' || true)
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changed Python files:"
          echo "$FILES"
      - name: Ruff check (changed files)
        if: steps.diff.outputs.files != ''
        run: echo "${{ steps.diff.outputs.files }}" | xargs ruff check
      - name: Ruff format check (changed files)
        if: steps.diff.outputs.files != ''
        run: echo "${{ steps.diff.outputs.files }}" | xargs ruff format --check

  # ── 分层纪律 ──
  backend-layering:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check API layering
        run: python scripts/check_layering.py

  # ── 依赖安全扫描 ──
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Backend pip-audit
        id: backend_audit
        continue-on-error: true
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pip-audit
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend npm audit
        id: frontend_audit
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Enforce security audit results
        if: always()
        env:
          BACKEND_AUDIT_OUTCOME: ${{ steps.backend_audit.outcome }}
          FRONTEND_AUDIT_OUTCOME: ${{ steps.frontend_audit.outcome }}
        run: |
          echo "Backend audit: $BACKEND_AUDIT_OUTCOME"
          echo "Frontend audit: $FRONTEND_AUDIT_OUTCOME"
          if [ "$BACKEND_AUDIT_OUTCOME" != "success" ] || [ "$FRONTEND_AUDIT_OUTCOME" != "success" ]; then
            exit 1
          fi
