# =============================================================================
# TopicEye CI — PR 轻量门禁（GitHub）+ 全量测试本地执行
# =============================================================================
# pull_request 触发轻量作业（类型检查 / 前端单测 / lint / 分层 / 文档引用 / 安全扫描），
# 保证 PR 阶段有真实门禁。高成本的 PostgreSQL 全量测试不在 GitHub 跑：
# 本地执行 `make test-backend`（backend/scripts/test_full_local.sh，
# 一次性 PG 容器跑在 127.0.0.1:5433，不占用开发栈）。
# workflow_dispatch 保留手动触发；push 到 main 自动复验轻量作业，
# 避免「直推 main 无任何 CI 证据」的盲区（见 #7 / #2）。
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # ── Frontend type check ──
  frontend-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit

  # ── Frontend unit tests + coverage gate ──
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Test with coverage
        run: npm run test:coverage

  # ── Lint: ruff（针对本次改动的 Python 文件做阻断式检查）──
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Compute changed Python files
        id: diff
        working-directory: .
        run: |
          BASE=$(git rev-parse HEAD^)
          FILES=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'backend/*.py' \
                  | sed 's|^backend/||' | grep '\.py$' || true)
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changed Python files:"
          echo "$FILES"
      - name: Ruff check (changed files)
        if: steps.diff.outputs.files != ''
        run: echo "${{ steps.diff.outputs.files }}" | xargs ruff check
      - name: Ruff format check (changed files)
        if: steps.diff.outputs.files != ''
        run: echo "${{ steps.diff.outputs.files }}" | xargs ruff format --check

  # ── 分层纪律 ──
  backend-layering:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check API layering
        run: python scripts/check_layering.py

  # ── AGENTS.md 引用校验 ──
  # AGENTS.md 是喂给 agent 的指令文件，命令与路径过期等于静默的错误。
  # 手工核对不可持续，故机器化：路径与 make 目标两类可无歧义判定。
  # 只查 AGENTS.md，不查 .agents/notes/ —— 后者是决策记录，里面的路径
  # 描述的是当时状态，允许随代码演进而变旧。
  agent-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check AGENTS.md references
        run: python scripts/check_agent_docs.py ../AGENTS.md

  # ── 依赖安全扫描 ──
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Backend pip-audit
        id: backend_audit
        continue-on-error: true
        working-directory: backend
        run: |
          pip install uv==0.11.21
          uv sync --frozen
          uv run pip-audit
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend npm audit
        id: frontend_audit
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci
          # 只审计生产依赖：dev 工具链（eslint 的 braces 链）有全版本受影响的
          # DoS advisory 且上游无补丁，不挡门；生产依赖维持 high 级严格门禁
          npm audit --audit-level=high --omit=dev
      - name: Enforce security audit results
        if: always()
        env:
          BACKEND_AUDIT_OUTCOME: ${{ steps.backend_audit.outcome }}
          FRONTEND_AUDIT_OUTCOME: ${{ steps.frontend_audit.outcome }}
        run: |
          echo "Backend audit: $BACKEND_AUDIT_OUTCOME"
          echo "Frontend audit: $FRONTEND_AUDIT_OUTCOME"
          if [ "$BACKEND_AUDIT_OUTCOME" != "success" ] || [ "$FRONTEND_AUDIT_OUTCOME" != "success" ]; then
            exit 1
          fi
