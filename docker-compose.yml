services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # Linux 引擎没有内置 host.docker.internal；host-gateway 让模型配置里
    # 指向宿主机本地推理服务的地址在容器内可达（macOS Docker Desktop 无此也行）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://topiceye:topiceye@postgres:5432/topiceye}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - AUTO_CREATE_TABLES_ON_STARTUP=${AUTO_CREATE_TABLES_ON_STARTUP:-true}
      - CACHE_WARMUP_ENABLED=${CACHE_WARMUP_ENABLED:-true}
      - STARTUP_SEED_ENABLED=${STARTUP_SEED_ENABLED:-true}
      - DUCKDB_THREADS=${DUCKDB_THREADS:-2}
      - DUCKDB_MEMORY_LIMIT=${DUCKDB_MEMORY_LIMIT:-256MB}
      - DUCKDB_EXTENSION_DIR=${DUCKDB_EXTENSION_DIR:-./data/duckdb_extensions}
      # 本地推理服务（host.docker.internal 上的 mlx_lm）单次生成可达 60s+，
      # 默认 45s 会先于网关超时；并发 4→6 适配本地模型无配额限制的场景
      - LLM_COMPLETION_TIMEOUT_SECONDS=${LLM_COMPLETION_TIMEOUT_SECONDS:-120}
      - LLM_WORKER_CONCURRENCY=${LLM_WORKER_CONCURRENCY:-6}
      # 本机代理 fake-ip 模式把外网域名解析进 198.18.0.0/15，SSRF 防护会
      # 误拦真实信源；放行该解析段（IP 字面量不受影响）。不用代理可移除
      - SSRF_FAKE_IP_PROXY_CIDR=${SSRF_FAKE_IP_PROXY_CIDR:-198.18.0.0/15}
      # LLM 传输层：litellm | native。native 走自建传输层（OpenAI 兼容族 /
      # anthropic / gemini），编排层零改动；不满足条件的 provider 显式回落
      # litellm 并记 warning。回滚：设为 litellm 后重启后端。
      - LLM_TRANSPORT=${LLM_TRANSPORT:-native}
      # litellm 导入时会联网拉远端模型价格表（失败重试 3 次），本机实测该
      # 端点多次不可达：拉取耗时 ~4.7s 且每次启动带 3 条重试告警。本仓库的
      # 计价不读那份表（走 llm_models + models.dev 目录表），线上唯一的
      # 模型也不在那份表里——改用 litellm 随包的本地备份，省掉这次网络依赖。
      # 需要恢复远端表时把本变量设为 False。
      - LITELLM_LOCAL_MODEL_COST_MAP=${LITELLM_LOCAL_MODEL_COST_MAP:-True}
      # macOS bind mount 下 inotify 不穿透，强制 watchfiles 轮询以启用热重载
      - WATCHFILES_FORCE_POLLING=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-topiceye}
      - POSTGRES_USER=${POSTGRES_USER:-topiceye}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-topiceye}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-topiceye}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - BACKEND_API_URL=http://backend:8000
      # macOS bind mount 下 inotify 不穿透，强制 chokidar/webpack 轮询以启用 HMR
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: npm run dev
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
