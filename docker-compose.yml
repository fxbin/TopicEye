services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-data:/app/data
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/topiceye.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - AUTO_CREATE_TABLES_ON_STARTUP=${AUTO_CREATE_TABLES_ON_STARTUP:-true}
      - CACHE_WARMUP_ENABLED=${CACHE_WARMUP_ENABLED:-true}
      - STARTUP_SEED_ENABLED=${STARTUP_SEED_ENABLED:-true}
      - DATABASE_SQLITE_DOMAIN_SPLIT_ENABLED=${DATABASE_SQLITE_DOMAIN_SPLIT_ENABLED:-false}
      - DATABASE_SQLITE_DOMAIN_DIR=${DATABASE_SQLITE_DOMAIN_DIR:-./data/domains}
      - DUCKDB_THREADS=${DUCKDB_THREADS:-2}
      - DUCKDB_MEMORY_LIMIT=${DUCKDB_MEMORY_LIMIT:-256MB}
      - DUCKDB_EXTENSION_DIR=${DUCKDB_EXTENSION_DIR:-./data/duckdb_extensions}
      # macOS bind mount 下 inotify 不穿透，强制 watchfiles 轮询以启用热重载
      - WATCHFILES_FORCE_POLLING=true
      # 微信读书 Skill API endpoint（服务端配置，用户只需在前端填 Key）
      - WEREAD_SKILL_API_URL=${WEREAD_SKILL_API_URL:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-topiceye}
      - POSTGRES_USER=${POSTGRES_USER:-topiceye}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-topiceye}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - BACKEND_API_URL=http://backend:8000
      # macOS bind mount 下 inotify 不穿透，强制 chokidar/webpack 轮询以启用 HMR
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: npm run dev
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  postgres-data:
