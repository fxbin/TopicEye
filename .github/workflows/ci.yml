# =============================================================================
# TopicEye CI — 后端测试在 PostgreSQL + 前端类型检查 + 前端单元测试
# =============================================================================
# SQLite 分支已移除，PostgreSQL 是唯一支持的 OLTP 后端。
# 前端 tsc 类型检查单独一个 job。
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend tests on PostgreSQL ──
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: topiceye_test
          POSTGRES_USER: topiceye
          POSTGRES_PASSWORD: topiceye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topiceye"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Run tests (PostgreSQL)
        env:
          DATABASE_URL: "postgresql+asyncpg://topiceye:topiceye@localhost:5432/topiceye_test"
          DUCKDB_THREADS: "1"
          DUCKDB_MEMORY_LIMIT: "128MB"
        run: python -m pytest tests/ -q --tb=short

  # ── Frontend type check ──
  frontend-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit

  # ── Frontend unit tests + coverage gate ──
  # 覆盖率门禁限定在 src/lib 的纯逻辑模块（阈值见 frontend/vitest.config.ts）。
  # 与后端 lint 同理走渐进式：先在核心逻辑立稳基线，新增测试后再逐步扩面、抬阈值。
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Test with coverage
        run: npm run test:coverage

  # ── Lint: ruff（针对本次改动的 Python 文件做阻断式检查）──
  # 渐进式门禁：只检查 PR 中变更的文件，避免一次性清理 700+ 历史告警。
  # 历史 lint 问题在单独的清理分支处理。main 的 push 用 HEAD^ 做基线。
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史来计算 diff 基线
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Compute changed Python files
        id: diff
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE=$(git rev-parse HEAD^)
          fi
          # backend/ 下变更的 .py 文件（相对于基线，且当前仍存在）
          FILES=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'backend/*.py' \
                  | sed 's|^backend/||' | grep '\.py$' || true)
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changed Python files:"
          echo "$FILES"
      - name: Ruff check (changed files)
        if: steps.diff.outputs.files != ''
        run: echo "${{ steps.diff.outputs.files }}" | xargs ruff check
      - name: Ruff format check (changed files)
        if: steps.diff.outputs.files != ''
        run: echo "${{ steps.diff.outputs.files }}" | xargs ruff format --check

  # ── 分层纪律：api/v1 禁止直接 ORM 查询 / 禁用 import（对应 AGENTS.md）──
  # 规则本是纯人工评审，容易漏；这一步把符号级的硬违规做成阻断门，
  # 防止清理成果被新代码回退。检查全量 api/v1 很快，无需 diff 化。
  backend-layering:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check API layering
        run: python scripts/check_layering.py
