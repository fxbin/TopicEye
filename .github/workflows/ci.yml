# =============================================================================
# TopicEye CI — 跑后端测试在 SQLite（默认）+ PostgreSQL（防跨 DB bug）
# =============================================================================
# 这次 INSERT 排除自增主键的 bug 就是 SQLite 测试通过但 PG 生产全挂。
# PG matrix 让 CI 自动抓这类跨 DB 兼容性问题。
#
# 前端 tsc 类型检查单独一个 job。
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend tests on SQLite ──
  backend-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests (SQLite)
        env:
          DATABASE_URL: "sqlite:///./test_ci.db"
        run: python -m pytest tests/ -q --tb=short

  # ── Backend tests on PostgreSQL (防跨 DB bug) ──
  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: topiceye_test
          POSTGRES_USER: topiceye
          POSTGRES_PASSWORD: topiceye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topiceye"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests (PostgreSQL)
        env:
          DATABASE_URL: "postgresql+asyncpg://topiceye:topiceye@localhost:5432/topiceye_test"
        # 只跑关键写入路径测试（这些是 SQLite/PG 差异最容易暴露的地方）
        run: |
          python -m pytest \
            tests/test_content_pipeline.py \
            tests/test_notification_per_user.py \
            tests/test_creation_history.py \
            tests/test_api_token_auth.py \
            tests/test_migrations.py \
            tests/test_analysis_recovery.py \
            -q --tb=short

  # ── Frontend type check ──
  frontend-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
