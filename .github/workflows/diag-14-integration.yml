name: Diagnostic #14 after two isolation fixes

on:
  pull_request:
    branches: [main]

jobs:
  bounded-backend-suite:
    if: github.head_ref == 'diag-14-after-two-isolation-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: topiceye_test
          POSTGRES_USER: topiceye
          POSTGRES_PASSWORD: topiceye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topiceye -d topiceye_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compose verified Worker test fixes in diagnostic workspace
        working-directory: .
        run: |
          git fetch origin issue-22-isolate-admin-duckdb-test issue-27-isolate-favorite-vector-rebuild
          git checkout origin/issue-22-isolate-admin-duckdb-test -- backend/tests/test_admin_api_permissions.py
          git checkout origin/issue-27-isolate-favorite-vector-rebuild -- backend/tests/test_content_favorite_api.py
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Verify composed Worker files
        run: |
          ruff check tests/test_admin_api_permissions.py tests/test_content_favorite_api.py
          ruff format --check tests/test_admin_api_permissions.py tests/test_content_favorite_api.py
      - name: Run bounded full PostgreSQL suite
        env:
          DATABASE_URL: "postgresql+asyncpg://topiceye:topiceye@localhost:5432/topiceye_test"
          DUCKDB_THREADS: "1"
          DUCKDB_MEMORY_LIMIT: "128MB"
        run: timeout --signal=TERM --kill-after=10s 180s python -m pytest tests/ -vv --tb=short -o faulthandler_timeout=30
